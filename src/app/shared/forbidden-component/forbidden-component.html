<div class="forbidden-page">
  <div class="card animate">
    <!-- Illustration -->
    <div class="illustration">
      <img src="assets/forbidden-illustration" alt="Accès refusé" />
    </div>

    <h1 class="title">Oups ! Accès refusé</h1>

    <p class="message">
      Vous n'avez pas les permissions nécessaires pour accéder à cette page.<br>
      Veuillez vous connecter avec un compte autorisé.
    </p>

    <button class="btn primary" (click)="goLogin()">Retour à la connexion</button>
  </div>
</div>
